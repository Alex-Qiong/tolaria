name: Fork Windows package (templates PR)

# Fork-only helper: builds a Windows x64 NSIS installer from the
# commit-message-templates feature branch so the feature can be tried out.
# Not part of the upstream PR; kept on the pkg/* branch only.
on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Version suffix appended to the app version (e.g. -tpl1)"
        required: false
        default: "-tpl1"

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            src-tauri\target
          key: ${{ runner.os }}-fork-tpl-cargo-x86_64-pc-windows-msvc-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fork-tpl-cargo-x86_64-pc-windows-msvc-

      - name: Cache Tauri Windows tools
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: ${{ runner.os }}-tauri-tools-nsis-3.11-nsis-tauri-utils-0.5.3

      - name: Prefetch Tauri NSIS toolchain
        shell: pwsh
        run: ./.github/scripts/prefetch-tauri-nsis.ps1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version
        id: ver
        shell: pwsh
        run: |
          $base = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $version = "$base${{ inputs.version_suffix }}"
          $tauri = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $tauri.version = $version
          $tauri | ConvertTo-Json -Depth 100 | Set-Content "src-tauri/tauri.conf.json"
          (Get-Content "src-tauri/Cargo.toml") -replace '^version = ".*"$', "version = `"$version`"" | Set-Content "src-tauri/Cargo.toml"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Tauri app (NSIS, no updater signing)
        shell: pwsh
        run: |
          # Fork build has no signing keys; disable updater artifacts via a
          # config file (avoids pwsh quote-stripping issues with --config JSON).
          Set-Content -Path "src-tauri/tauri.fork-windows.json" -Value '{"bundle":{"createUpdaterArtifacts":false}}'
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.fork-windows.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: tolaria-windows-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish to fork Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tolaria-windows-installer
          path: dist

      - name: Create GitHub Release on fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="fork-win-templates-${{ github.run_number }}"
          gh release create "$TAG" dist/*-setup.exe \
            --title "Tolaria Windows 安装包（含推送内容模板功能）" \
            --notes "基于 PR #1258（feat/commit-message-templates）构建的 Windows x64 NSIS 安装包。未签名，安装时 Windows 可能会提示未知发布者，属正常现象。"
